description: >-
  USDA's Animal and Plant Health Inspection Service (APHIS) protects the health
  and value of U.S. agriculture and natural resources by safeguarding against
  agricultural pests and diseases, ensuring the welfare of animals, and
  supporting sustainable agricultural practices. APHIS provides digital services
  including the eFile permitting system for import/export permits, the
  Agricultural Commodity Import Requirements (ACIR) portal, a geospatial hub
  for spatial analysis, data visualization tools, and open datasets via data.gov.
