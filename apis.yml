    type: DataModel
  - url: conventions/animal-and-plant-health-inspection-service-conventions.yml
    type: Conventions
  - url: https://www.aphis.usda.gov/map-data-disclaimer
    type: TermsOfService
  description: >-
    The APHIS and AMS Geospatial Hub is the public geospatial surface of USDA Marketing and Regulatory Programs (MRP), the umbrella covering APHIS and AMS. Behind the landing page sits a genuinely machine-readable API: 93 public ArcGIS REST feature services, anonymously callable with no key, covering PPQ federal plant quarantine boundaries, Veterinary Services disease detections (HPAI in livestock, bovine TB and brucellosis herds, RHDV2, New World Screwworm), Wildlife Services oral rabies vaccination zones, and AMS commodity and rail-network layers. Services declare capabilities Query (two also declare Extract), support SQL-92 where filters, spatial filters, statistics, and export to GeoJSON, CSV, KML, shapefile and GeoPackage. Page size is capped by maxRecordCount (2000 on most services). Application errors are returned with HTTP 200 and an error object in the body. Use is subject to the MRP Map and Data Disclaimer.
