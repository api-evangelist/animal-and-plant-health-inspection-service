summary: >-
  APHIS publishes no developer API with its own key-issuance flow. Every APHIS digital
  service that carries an identity boundary authenticates through USDA eAuthentication,
  federated into the Salesforce Experience Cloud tenants that host APHIS eFile, ACIR and
  the Animal Care Public Search Tool. Each of those three hosts serves a live OpenID
  Connect Discovery 1.0 document whose issuer is the APHIS host itself, so an OIDC/OAuth 2.0
  authorization-code surface is measurably present - but it is a platform sign-in surface
  for the web applications, not a documented developer API. The one genuinely anonymous
  machine-readable surface APHIS operates, the USDA-MRP ArcGIS REST feature services,
  requires no authentication at all for read/query.
