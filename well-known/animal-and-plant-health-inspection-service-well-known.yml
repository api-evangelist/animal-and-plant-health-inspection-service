note: >-
  Probed the named RFC/de-facto well-known path list on all seven APHIS-operated hosts.
  The only served documents are OpenID Connect discovery documents on the three Salesforce
  Experience Cloud sites (APHIS eFile, ACIR, and the Animal Care Public Search Tool). Those
  are genuine RFC 8414 / OIDC Discovery 1.0 documents whose `issuer` is the APHIS host itself,
  so they are served by APHIS-controlled hosts even though the OpenID Provider is the
  Salesforce platform APHIS runs those applications on. No security.txt, no api-catalog,
  no ai-plugin.json, and no agent card is served anywhere. www.aphis.usda.gov terminates
  the HTTP/2 stream for non-browser clients (Akamai bot mitigation), so every path on that
  host is recorded as `<no response>` rather than as an absence - the site itself is
  demonstrably live and renders in a browser-equivalent fetch.
