relationships:
- from: Quarantine AGOL
  to: US State
  type: belongs_to
  via: Quarantine_State / Quarantine_State_Abbr
  note: Every federal quarantine polygon is keyed to a state and county by name, not by a surrogate id.
- from: Quarantine AGOL
  to: US County
  type: belongs_to
  via: Quarantine_County
- from: Quarantine AGOL
  to: Pest Program
  type: belongs_to
  via: Quarantine_Program
  note: Program is the discriminator that separates ALB, EAB, citrus, spongy moth and fire ant quarantine sets.
- from: Asian Citrus Psyllid Federal Quarantine
  to: Regulatory Document
  type: has_one
  via: RegDoc / RegDocLink
  note: RegDocLink is a URL into the Federal Register or APHIS regulatory notice that established the quarantine
    - the only outbound identifier in the model.
- from: NWS Cases
  to: Initial Detections by State
  type: has_many
  via: province / district / town locality strings
  note: No shared surrogate key; the join is textual locality plus collection_date/epi_week.
- from: TB_Herds
  to: US County
  type: belongs_to
  via: County + State
- from: Brucellosis_Herds
  to: US County
  type: belongs_to
  via: FIPS
