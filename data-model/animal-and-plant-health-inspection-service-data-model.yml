access: anonymous read; capabilities are Query (a few services also Extract). No write surface is exposed.
id_conventions:
- field: OBJECTID
  meaning: ArcGIS per-layer surrogate row id. Not stable across service republishes; never use it as a durable reference.
- field: FIPS / STATE_FIPS / CNTY_FIPS
  meaning: US Census FIPS geographic codes - the only cross-layer joinable identifier in the model.
- field: RegDoc / RegDocLink
  meaning: Citation and URL of the Federal Register document or APHIS regulatory notice establishing a quarantine.
- field: epi_week
  meaning: Epidemiological week, used on New World Screwworm case layers for time-series animation.
