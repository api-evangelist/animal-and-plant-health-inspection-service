note: 'Derived from the live ArcGIS REST metadata of the USDA-MRP feature services, not from any APHIS-published
  object reference - APHIS publishes none. Only the ten flagship services were walked layer-by-layer; the tenant
  carries 93 services in total (see services_total). The model is flat and denormalised: there is no shared entity
  registry, no surrogate primary key beyond per-layer OBJECTID, and joins between layers are made on FIPS codes
  or on locality strings. That is the finding, not a gap in the derivation.'
ownership: The tenant 2C1NQ7u6M6SXoa8p on Esri ArcGIS Online is the USDA Marketing and Regulatory Programs (MRP)
  organization - every item is owned by an account suffixed _usda_mrp, the service names map to named APHIS programs
  (PPQ, VS, WS), and APHIS's own Map and Data Disclaimer at https://www.aphis.usda.gov/map-data-disclaimer states
  the data is the "sole property" of MRPBS, APHIS or AMS. The Esri-hosted domain is the tenant arrangement, the
  same way a customer-subdomain server block names a real host.
