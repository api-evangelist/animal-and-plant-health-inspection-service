domain_standards:
  - id: geoservices-rest
    name: Esri GeoServices REST / ArcGIS REST API (Feature Service)
    market: geospatial
    conforms: true
    evidence:
      - url: https://services7.arcgis.com/2C1NQ7u6M6SXoa8p/arcgis/rest/services?f=json
        status: 200
        detail: >-
          Service directory returns currentVersion 12 and 93 FeatureServer services. Individual
          services expose the standard Feature Service contract - layers[], fields[] with esriFieldType
          types, geometryType (esriGeometryPolygon/esriGeometryPoint), capabilities, maxRecordCount,
          and /query with supportedQueryFormats JSON.
      - url: https://services7.arcgis.com/2C1NQ7u6M6SXoa8p/arcgis/rest/services/PPQ_GIS_Federal_Quarantine_Feature_Layer/FeatureServer?f=json
        status: 200
        detail: capabilities "Query,Extract"; supportedExportFormats includes geojson, csv, kml, shapefile, geoPackage.
    note: >-
      This is the one real domain-standard contract APHIS ships. It is the de-facto geospatial
      web-service standard for the sector, and a consumer who already speaks ArcGIS REST can read
      APHIS quarantine, disease-detection and surveillance layers with no bespoke connector.
  - id: ogcapi-features
    name: OGC API - Features
    market: geospatial
    conforms: false
    evidence:
      - url: https://services7.arcgis.com/2C1NQ7u6M6SXoa8p/arcgis/rest/services/Federal_Citrus_Quarantine_Data/OGCFeatureServer?f=json
        status: 200
        detail: >-
          Body is {"error":{"code":400,"message":"Invalid URL"}} - the OGC Feature Server view is
          not enabled on any probed service, so no OGC API - Features landing page or its OpenAPI
          document is served. Probed on four services; all identical.
    note: >-
      Enabling the OGC Feature Server view on these existing services would give APHIS an
      OGC-conformant surface AND a real OpenAPI 3.0 document at /OGCFeatureServer/api, at no
      data-migration cost. This is the single highest-leverage change available to APHIS.
  - id: geojson
    name: GeoJSON (RFC 7946)
    market: geospatial
    conforms: true
    evidence:
      - url: https://services7.arcgis.com/2C1NQ7u6M6SXoa8p/arcgis/rest/services/PPQ_GIS_Federal_Quarantine_Feature_Layer/FeatureServer?f=json
        status: 200
        detail: supportedExportFormats declares geojson; layer /query accepts f=geojson.
  - id: dcat-us
    name: DCAT-US (Project Open Data) catalog
    market: government open data
    conforms: false
    evidence:
      - url: https://catalog.data.gov/organization/aphis-usda-gov
        status: 404
        detail: The APHIS-specific data.gov organization no longer resolves; APHIS datasets now sit under the department-wide /organization/usda.
compliance_program:
  published: false
  note: >-
    APHIS publishes no trust center, no SOC 2 / ISO 27001 / FedRAMP attestation of its own, and
    no named certification page. As a federal agency its systems are governed by FISMA and USDA
    ATO processes, but no public artifact asserting that was found on any APHIS host, so nothing
    is claimed here.
