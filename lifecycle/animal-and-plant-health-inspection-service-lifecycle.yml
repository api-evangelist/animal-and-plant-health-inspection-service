summary: >-
  APHIS operates production digital services but publishes no API lifecycle apparatus. There is no
  versioning policy, no deprecation policy, no Sunset/Deprecation header practice, no SLA, no
  changelog, and no status page. The only version signal anywhere on the surface is the ArcGIS REST
  currentVersion advertised by the Esri platform, which is Esri's version and not APHIS's.
versioning:
  policy_published: false
  scheme: none
  note: >-
    No APHIS surface is versioned in a URL, header, or media type. The ArcGIS feature services report
    currentVersion 12, which is the ArcGIS Online platform release, not a contract version APHIS
    controls or commits to.
  evidence:
    - url: https://services7.arcgis.com/2C1NQ7u6M6SXoa8p/arcgis/rest/services?f=json
      status: 200
      detail: currentVersion 12 (Esri platform version)
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation policy or notice period is published. Service turnover is observable in the data
    instead: the tenant carries multiple superseded copies of the same layer (NASS_2017_STATE_1_049dc,
    _15cfe, _472f3, _8b447, _abf8b, _b5103; RHDV2 case-count 2020-2021 alongside 2020-2023) with no
    marker saying which is current and no removal date on the stale ones. A consumer cannot tell a
    live layer from an abandoned one.
  deprecated_operations: []
  observed_supersession:
    - current: RHDV2_USCounties_CaseCount_2020_2023
      superseded:
        - RHDV2_USCounties_CaseCount_2020_2021
        - RHDV2_USCounties_CaseCount_2020_2021_View
        - RHDV2_USCounties_CaseCount_2020_2021_View2
      basis: date range in the service name; neither is marked deprecated
    - current: unknown
